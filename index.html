<script>
var INITIAL_PAGE = 'list';
let adminPassword = '';
let streamers = [];
let listLoaded = false;
let currentSelectedId = null;
let carouselInterval = null;

// Tab Activation Logic
document.addEventListener('DOMContentLoaded', () => {
  // Setup initial active tab classes based on current logic
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('bg-white/80', 'text-slate-900', 'shadow-sm');
        b.classList.add('text-slate-600');
      });
      this.classList.remove('text-slate-600');
      this.classList.add('bg-white/80', 'text-slate-900', 'shadow-sm');
    });
  });
  
  // Trigger initial tab
  const initBtn = document.getElementById('tab-' + INITIAL_PAGE);
  if(initBtn) {
    initBtn.click();
    // showPage is called via onclick attribute
  } else {
    document.getElementById('tab-list').click();
  }
});

function showPage(name) {
  document.querySelectorAll('.page-section').forEach(el => {
    el.classList.add('hidden');
    if(el.id === 'page-' + name) {
      el.classList.remove('hidden');
    }
  });

  if (name === 'list' && !listLoaded) {
    listLoaded = true;
    loadStreamers();
  }
}

// Mock Server Call
function callServer(functionName, ...args) {
  return new Promise(resolve => {
    setTimeout(() => {
      if (functionName === 'getAllSoopStatus') {
        resolve({
          success: true,
          data: [
            { content: 'haru123', title: 'Haru', instagram: 'haru123_ig', status: { isLive: true, viewerCount: 4520, title: 'Morning Chat!', nickname: 'Haru' } },
            { content: 'xiaoai99', title: '小愛', instagram: 'xiaoai99_ig', status: { isLive: true, viewerCount: 3100, title: 'Let\'s Play Valorant' } },
            { content: 'sora001', title: 'Sora', instagram: 'sora_ig', status: { isLive: true, viewerCount: 1250, title: 'Singing stream~' } },
            { content: 'yuna_live', title: 'Yuna', instagram: 'yuna_ig', status: { isLive: true, viewerCount: 890, title: 'Just chatting' } },
            { content: 'mochi33', title: 'Mochi', instagram: 'mochi_ig', status: { isLive: false } },
            { content: 'kenji44', title: 'Kenji', instagram: 'kenji_ig', status: { isLive: false } }
          ]
        });
      } else {
        resolve([]);
      }
    }, 500);
  });
}

async function loadStreamers() {
  const loading = document.getElementById('loading');
  const cardList = document.getElementById('cardList');
  if (!cardList) return;

  loading.classList.remove('hidden');
  cardList.innerHTML = '';

  try {
    const response = await callServer('getAllSoopStatus');
    streamers = response.data || [];
    renderCards();
  } catch (error) {
    cardList.innerHTML = `<div class="col-span-full text-center py-10 text-red-500">無法取得資料</div>`;
  } finally {
    loading.classList.add('hidden');
  }
}

function renderCards() {
  const cardList = document.getElementById('cardList');
  if (!streamers.length) {
    cardList.innerHTML = '<div class="col-span-full text-center py-10 text-slate-500">目前沒有主播</div>';
    return;
  }

  cardList.innerHTML = streamers.map((item, index) => {
    const status = item.status || {};
    const isLive = status.isLive === true;
    const title = item.title || status.nickname || item.content;
    const viewer = Number(status.viewerCount || 0);
    const liveUrl = status.liveUrl || ('https://play.sooplive.co.kr/' + encodeURIComponent(item.content));
    const isSelected = currentSelectedId === item.content;
    
    // Use UI Avatars based on name for placeholder
    const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(title)}&background=random&color=fff&size=128`;
    const igUrl = item.instagram ? (item.instagram.startsWith('http') ? item.instagram : `https://instagram.com/${item.instagram}`) : '';

    return `
      <div class="glass-card rounded-2xl p-5 cursor-pointer opacity-0 animate-fade-in-up ${isSelected ? 'selected' : ''}" 
           style="animation-delay: ${index * 50}ms"
           id="card-${escapeAttr(item.content)}" 
           onclick="toggleDetail('${escapeAttr(item.content)}', '${escapeAttr(title)}', '${escapeAttr(liveUrl)}', '${escapeAttr(igUrl)}', '${avatarUrl}')">
        
        <div class="flex items-start gap-4">
          <img src="${avatarUrl}" alt="${escapeAttr(title)}" class="w-12 h-12 rounded-full object-cover bg-white/50 border border-white/60 shadow-sm shrink-0">
          
          <div class="flex-1 min-w-0">
            <h3 class="text-lg font-bold text-slate-800 truncate">${escapeHtml(title)}</h3>
            
            <div class="mt-1.5 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold ${isLive ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-slate-100/50 text-slate-500 border border-slate-200/50'}">
              ${isLive ? '<span class="w-2 h-2 rounded-full bg-red-500 animate-breathe"></span> Live' : '⚫ 離線'}
            </div>
            
            ${isLive ? `
              <div class="mt-3 space-y-1">
                <div class="text-sm font-medium text-slate-600 flex items-center gap-1">
                  <span class="material-symbols-outlined text-[16px]">group</span>
                  ${viewer.toLocaleString()} 人觀看
                </div>
                ${status.title ? `<div class="text-sm text-slate-500 truncate" title="${escapeHtml(status.title)}">${escapeHtml(status.title)}</div>` : ''}
              </div>
            ` : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// Detail View Logic
function toggleDetail(id, title, liveUrl, instagram, avatarUrl) {
  const splitView = document.getElementById('split-view');
  const detailPane = document.getElementById('detailPane');
  
  if (currentSelectedId === id) {
    closeDetail();
    return;
  }
  
  if (currentSelectedId) {
    const prevCard = document.getElementById('card-' + currentSelectedId);
    if (prevCard) prevCard.classList.remove('selected');
  }
  
  currentSelectedId = id;
  const newCard = document.getElementById('card-' + id);
  if (newCard) newCard.classList.add('selected');
  
  // Update detail content
  document.getElementById('detailTitle').textContent = title;
  document.getElementById('detailEnterStream').href = liveUrl;
  document.getElementById('detailAvatar').src = avatarUrl;
  
  const igEl = document.getElementById('detailIgLink');
  if(instagram) {
    igEl.href = instagram;
    igEl.style.display = 'inline-flex';
  } else {
    igEl.style.display = 'none';
  }
  
  // Show detail pane - in responsive view it might need different handling, but we follow the original flex layout mostly
  detailPane.classList.remove('hidden');
  detailPane.classList.add('block');
  
  // Update list grid for split view dynamically via tailwind classes
  const cardList = document.getElementById('cardList');
  cardList.classList.remove('lg:grid-cols-3');
  cardList.classList.add('lg:grid-cols-2');

  const images = document.querySelectorAll('.carousel-item img');
  images.forEach((img, idx) => {
    img.src = `https://loremflickr.com/400/300/streaming,gaming?random=${id}${idx}`;
  });

  startCarousel();
}

function closeDetail() {
  const detailPane = document.getElementById('detailPane');
  detailPane.classList.add('hidden');
  detailPane.classList.remove('block');
  
  const cardList = document.getElementById('cardList');
  cardList.classList.add('lg:grid-cols-3');
  cardList.classList.remove('lg:grid-cols-2');
  
  stopCarousel();
  
  if (currentSelectedId) {
    const card = document.getElementById('card-' + currentSelectedId);
    if (card) card.classList.remove('selected');
    currentSelectedId = null;
  }
}

// 3D Carousel
function startCarousel() {
  const items = document.querySelectorAll('.carousel-item');
  if (!items.length) return;
  let currentIndex = 0;
  
  function updateCarousel() {
    items.forEach(item => item.className = 'carousel-item hidden');
    let prevIndex = (currentIndex - 1 + items.length) % items.length;
    let nextIndex = (currentIndex + 1) % items.length;
    
    items[currentIndex].classList.add('active');
    items[currentIndex].classList.remove('hidden');
    
    items[prevIndex].classList.add('prev');
    items[prevIndex].classList.remove('hidden');
    
    items[nextIndex].classList.add('next');
    items[nextIndex].classList.remove('hidden');
  }
  
  updateCarousel();
  if (carouselInterval) clearInterval(carouselInterval);
  carouselInterval = setInterval(() => {
    currentIndex = (currentIndex + 1) % items.length;
    updateCarousel();
  }, 3000);
}

function stopCarousel() {
  if (carouselInterval) clearInterval(carouselInterval);
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
function escapeAttr(value) { return escapeHtml(value); }
